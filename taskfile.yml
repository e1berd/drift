
version: '3'

dotenv:
  - .env

vars:
  # Переопределить: task up COMPOSE='docker compose'
  COMPOSE: '{{.COMPOSE | default "podman compose"}}'

includes:
  app:
    taskfile: ./app/taskfile.yml
    dir: ./app

  web:
    taskfile: ./web/taskfile.yml
    dir: ./web

tasks:
  default:
    desc: Показать доступные команды
    cmds:
      - task --list

  dev:
    desc: Hot reload — Postgres и Kratos в контейнерах, Vite и Go (air) на хосте, открывать http://localhost:8080
    cmds:
      - task: up
      - task: dev:watch

  dev:watch:
    internal: true
    deps: [web:dev, app:dev]

  build:
    desc: Собрать единый бинарник bin/drift (Vue и шаблоны внутри)
    cmds:
      - task: web:build
      - task: app:build

  release:
    desc: Выпустить релиз из master — тег-дата vГГГГ.ММДД.N, сборку и публикацию делает GitHub Actions
    preconditions:
      - sh: gh auth status >/dev/null 2>&1
        msg: 'gh не залогинен: gh auth login'
      - sh: test "$(git branch --show-current)" = master
        msg: Релиз выпускается только из master
      - sh: test -z "$(git status --porcelain)"
        msg: В рабочей копии есть незакоммиченные изменения
    cmds:
      - git fetch --quiet --tags origin master
      - cmd: git merge-base --is-ancestor origin/master HEAD || { echo "origin/master впереди локального master — сделай git pull"; exit 1; }
        silent: true
      - cmd: |
          if tag=$(git describe --exact-match --tags --match 'v*' HEAD 2>/dev/null); then
            echo "HEAD уже выпущен как $tag"; exit 1
          fi
        silent: true
      - git tag -a {{.VERSION}} -m {{.VERSION}}
      - git push --atomic origin HEAD:master refs/tags/{{.VERSION}}
      - task: release:watch
        vars: {VERSION: '{{.VERSION}}'}
    vars:
      VERSION:
        sh: &next-version |
          prefix="v$(date -u +%Y).$(date -u +%m%d | sed 's/^0//')"
          last=$(git ls-remote --tags --refs origin "refs/tags/$prefix.*" | awk -F. '{print $NF}' | sort -n | tail -n 1)
          echo "$prefix.$(( ${last:--1} + 1 ))"

  release:next:
    desc: Показать версию, которую получит следующий релиз
    silent: true
    vars:
      VERSION:
        sh: *next-version
    cmds:
      - echo {{.VERSION}}

  release:watch:
    internal: true
    silent: true
    cmds:
      - |
        echo "Жду workflow release для {{.VERSION}}…"
        for i in $(seq 30); do
          run=$(gh run list --workflow release.yml --branch {{.VERSION}} --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run" ] && break
          sleep 2
        done
        [ -n "$run" ] || { echo "Workflow не запустился, см. https://github.com/e1berd/drift/actions"; exit 1; }
        gh run watch "$run" --exit-status --interval 10
        gh release view {{.VERSION}} --json url --jq .url

  test:
    desc: Запустить Go- и Vue-тесты
    cmds:
      - task: app:test
      - task: web:test

  kratos:logs:
    desc: Логи Ory Kratos
    cmds:
      - '{{.COMPOSE}} logs -f kratos'

  db:up:
    desc: Запустить PostgreSQL
    cmds:
      - '{{.COMPOSE}} up -d postgres'

  db:down:
    desc: Остановить PostgreSQL
    cmds:
      - '{{.COMPOSE}} stop postgres'

  db:logs:
    desc: Логи PostgreSQL
    cmds:
      - '{{.COMPOSE}} logs -f postgres'

  up:
    desc: Запустить инфраструктуру для разработки (Postgres + Kratos, без drift)
    cmds:
      # контейнер drift из `task stack` занимает :8080 — освобождаем порт для dev-сервера
      - '{{.COMPOSE}} stop drift'
      - '{{.COMPOSE}} up -d postgres kratos'

  stack:
    desc: Production-сборка целиком в контейнерах (без hot reload, изменения — только пересборкой), открывать http://localhost:8080
    cmds:
      - '{{.COMPOSE}} up -d --build'

  down:
    desc: Остановить инфраструктуру
    cmds:
      - '{{.COMPOSE}} down'

  logs:
    desc: Логи всех контейнеров
    cmds:
      - '{{.COMPOSE}} logs -f'
