
version: '3'

dotenv:
  - .env

vars:
  # Переопределить: task up COMPOSE='docker compose'
  COMPOSE: '{{.COMPOSE | default "podman compose"}}'

includes:
  app:
    taskfile: ./app/taskfile.yml
    dir: ./app

  web:
    taskfile: ./web/taskfile.yml
    dir: ./web

tasks:
  default:
    desc: Показать доступные команды
    cmds:
      - task --list

  dev:
    desc: Запустить Vite и Go (с hot reload) вместе, открывать http://localhost:8080
    deps: [web:dev, app:dev]

  build:
    desc: Собрать единый бинарник bin/drift (Vue и шаблоны внутри)
    cmds:
      - task: web:build
      - task: app:build

  test:
    desc: Запустить Go- и Vue-тесты
    cmds:
      - task: app:test
      - task: web:test

  kratos:logs:
    desc: Логи Ory Kratos
    cmds:
      - '{{.COMPOSE}} logs -f kratos'

  db:up:
    desc: Запустить PostgreSQL
    cmds:
      - '{{.COMPOSE}} up -d postgres'

  db:down:
    desc: Остановить PostgreSQL
    cmds:
      - '{{.COMPOSE}} stop postgres'

  db:logs:
    desc: Логи PostgreSQL
    cmds:
      - '{{.COMPOSE}} logs -f postgres'

  up:
    desc: Запустить инфраструктуру для разработки (Postgres + Kratos, без drift)
    cmds:
      - '{{.COMPOSE}} up -d postgres kratos'

  stack:
    desc: Собрать образ и запустить всё в контейнерах, открывать http://localhost:8080
    cmds:
      - '{{.COMPOSE}} up -d --build'

  down:
    desc: Остановить инфраструктуру
    cmds:
      - '{{.COMPOSE}} down'

  logs:
    desc: Логи всех контейнеров
    cmds:
      - '{{.COMPOSE}} logs -f'
