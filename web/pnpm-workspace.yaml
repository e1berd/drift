minimumReleaseAge: 0
trustLockfile: true

overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'
  'typescript': 'npm:typescript-native-bridge@latest'

peerDependencyRules:
  allowAny:
    - 'vue'

minimumReleaseAgeExclude:
  - '@kubb/adapter-oas@5.21.1'
  - '@kubb/ast@5.21.1'
  - '@kubb/cli@5.21.1'
  - '@kubb/core@5.21.1'
  - '@kubb/kit@5.21.1'
  - '@kubb/mcp@5.21.1'
  - '@kubb/parser-md@5.21.1'
  - '@kubb/parser-ts@5.21.1'
  - '@kubb/plugin-barrel@5.21.1'
  - '@kubb/plugin-client@6.1.1'
  - '@kubb/plugin-ts@5.5.5'
  - '@kubb/plugin-vue-query@5.10.5'
  - '@kubb/plugin-zod@5.9.5'
  - '@kubb/renderer-jsx@5.21.1'
  - '@kubb/studio@5.21.1'
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/vue-query@5.108.0'
  - kubb@5.21.1
  - unplugin-kubb@5.21.1

allowBuilds:
  esbuild: true
  lefthook: true
  vue-demi: true
