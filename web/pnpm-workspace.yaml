packages:
  - packages/*
  - apps/*

catalog:
  vue: ^3.5.42
  '@tanstack/vue-query': 5.108.0
  vue-router: ^5.3.1
  '@uppy/core': 6.3.2
  vue-i18n: ^11.4.20
  '@tiptap/core': 3.34.0
  '@tiptap/extensions': 3.34.0
  '@tiptap/pm': 3.34.0
  '@tiptap/starter-kit': 3.34.0
  '@tiptap/vue-3': 3.34.0
  '@codemirror/language': ^6.13.1
  '@codemirror/language-data': 6.5.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.15
  'codemirror': 6.0.2
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-web-links': 0.12.0
  '@xterm/xterm': 6.0.0

minimumReleaseAge: 0
trustLockfile: true

overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'
  'typescript': 'npm:typescript-native-bridge@latest'

peerDependencyRules:
  allowAny:
    - 'vue'

minimumReleaseAgeExclude:
  - '@kubb/adapter-oas@5.21.1'
  - '@kubb/ast@5.21.1'
  - '@kubb/cli@5.21.1'
  - '@kubb/core@5.21.1'
  - '@kubb/kit@5.21.1'
  - '@kubb/mcp@5.21.1'
  - '@kubb/parser-md@5.21.1'
  - '@kubb/parser-ts@5.21.1'
  - '@kubb/plugin-barrel@5.21.1'
  - '@kubb/plugin-client@6.1.1'
  - '@kubb/plugin-ts@5.5.5'
  - '@kubb/plugin-vue-query@5.10.5'
  - '@kubb/plugin-zod@5.9.5'
  - '@kubb/renderer-jsx@5.21.1'
  - '@kubb/studio@5.21.1'
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/vue-query@5.108.0'
  - kubb@5.21.1
  - unplugin-kubb@5.21.1

allowBuilds:
  esbuild: true
  lefthook: true
  vue-demi: true
