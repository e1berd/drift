x-db: &db
  POSTGRES_USER: ${POSTGRES_USER:-drift}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drift}
  POSTGRES_DB: ${POSTGRES_DB:-drift}

services:
  drift:
    build:
      context: .
      dockerfile: Containerfile
      network: host
    image: localhost/drift:latest
    pull_policy: build
    mem_limit: 1536m
    userns_mode: keep-id:uid=10001,gid=10001
    depends_on:
      postgres:
        condition: service_healthy
      kratos:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DRIFT_ADDR: :8080
      DRIFT_PUBLIC_URL: http://localhost:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-drift}:${POSTGRES_PASSWORD:-drift}@postgres:5432/${POSTGRES_DB:-drift}?sslmode=disable
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
    volumes:
      - ./workspace:/workspace:z
      - ./data/agents:/var/lib/drift/agents:z
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    mem_limit: 512m
    userns_mode: keep-id:uid=70,gid=70
    ports:
      - "127.0.0.1:5432:5432"
    environment: *db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kratos-db:
    image: docker.io/library/postgres:17-alpine
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-drift}
      PGPASSWORD: ${POSTGRES_PASSWORD:-drift}
      PGDATABASE: ${POSTGRES_DB:-drift}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'kratos'" | grep -q 1
        || psql -c "CREATE DATABASE kratos"
    restart: "no"

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0
    mem_limit: 256m
    depends_on:
      kratos-db:
        condition: service_completed_successfully
    environment:
      DSN: postgres://${POSTGRES_USER:-drift}:${POSTGRES_PASSWORD:-drift}@postgres:5432/kratos?sslmode=disable
      SQA_OPT_OUT: "true"
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro,z
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: "no"

  kratos:
    image: docker.io/oryd/kratos:v26.2.0
    mem_limit: 256m
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4433:4433"
      - "127.0.0.1:4434:4434"
    environment:
      DSN: postgres://${POSTGRES_USER:-drift}:${POSTGRES_PASSWORD:-drift}@postgres:5432/kratos?sslmode=disable&max_conns=10&max_idle_conns=2
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:-change-me-at-least-32-characters-long}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:-change-me-exactly-32-characters!}
      SELFSERVICE_METHODS_PASSKEY_ENABLED: ${KRATOS_PASSKEY_ENABLED:-true}
      SQA_OPT_OUT: "true"
    volumes:
      - ./deploy/kratos:/etc/config/kratos:ro,z
    command: serve -c /etc/config/kratos/kratos.yml --dev
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4434/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

