# Сообщения Kratos по ID (https://www.ory.sh/docs/kratos/concepts/ui-messages).
# Неизвестные ID показываются как прислал Kratos (по-английски).
kratos:
  "1010003": Подтвердите, что это вы, чтобы продолжить.
  "4000006": Неверный email или пароль.
  "4000010": Аккаунт ещё не активирован. Подтвердите адрес электронной почты.
  "4010001": Время на вход истекло, попробуйте ещё раз.
