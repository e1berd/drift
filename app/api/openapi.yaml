openapi: 3.1.0
info:
  title: Drift API
  version: 1.0.0
  description: >-
    Workspace API for projects, sessions, messages, drafts and project files.
    Follows the Google API design guide: list methods use page_size/page_token (AIP-158),
    resources expose createTime/updateTime (AIP-142).
servers:
  - url: /api
security:
  - kratosSession: []
tags:
  - name: projects
  - name: sessions
  - name: drafts
  - name: attachments
  - name: files
  - name: subscriptions
  - name: events
  - name: terminal
  - name: git
  - name: delivery
paths:
  /folders:
    get:
      operationId: listFolders
      tags: [files]
      description: >-
        Subfolders of one folder of the workspace root, used to pick a project path.
        Standard List method (AIP-132) without paging: one folder level per call.
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Visible subfolders, sorted by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        default: { $ref: '#/components/responses/Error' }
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of projects, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListProjectsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: The created project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRename' }
      responses:
        '200':
          description: The renamed project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProject
      tags: [projects]
      responses:
        '204': { description: 'Deleted. Files on disk stay.' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{projectId}/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listSessions
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of sessions, latest activity first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionInput' }
      responses:
        '201':
          description: The created session and its first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{projectId}/tree:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listTree
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Entries of one folder, folders first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTreeEntry
      tags: [files]
      description: Creates an empty file or a folder, with missing parent folders (AIP-133).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeEntryInput' }
      responses:
        '201':
          description: The created entry. 409 when the path is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeEntry' }
        default: { $ref: '#/components/responses/Error' }
  /projects/{projectId}/file:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: readFile
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Text content up to 1 MiB, or a binary marker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContent' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateFile
      tags: [files]
      description: Replaces the text of an existing file; content is its only mutable field (AIP-134).
      parameters:
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileInput' }
      responses:
        '200':
          description: The saved file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContent' }
        default: { $ref: '#/components/responses/Error' }
  /sessions:
    get:
      operationId: listStandaloneSessions
      description: Sessions that belong to no project, latest activity first (AIP-158 pagination).
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of standalone sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createStandaloneSession
      description: >-
        Creates a session without a project (AIP-133). Its agent works in a private empty
        folder that is deleted together with the session.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionInput' }
      responses:
        '201':
          description: The created session and its first message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /sessions:search:
    get:
      operationId: searchSessions
      description: >-
        Custom method (AIP-136) that finds sessions of every project and standalone chats
        whose title contains the query, case-insensitive, latest activity first
        (AIP-158 pagination).
      tags: [sessions]
      parameters:
        - name: query
          in: query
          required: true
          description: Text to look for in session titles, up to 200 characters.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of matching sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [sessions]
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionUpdate' }
      responses:
        '200':
          description: The updated session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      tags: [sessions]
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}:stop:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: stopSession
      description: >-
        Custom method (AIP-136): interrupts the agent's current answer. Messages queued
        while it ran are kept and go to the agent right after, as the next prompt.
      tags: [sessions]
      responses:
        '204': { description: 'Interrupted, or nothing was running.' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/tree:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listSessionTree
      description: >-
        Files of the folder the session's agent works in: its project, or the private
        folder of a standalone session.
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Entries of one folder, folders first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSessionTreeEntry
      tags: [files]
      description: Creates an empty file or a folder, with missing parent folders (AIP-133).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreeEntryInput' }
      responses:
        '201':
          description: The created entry. 409 when the path is taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeEntry' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/file:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: readSessionFile
      tags: [files]
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Text content up to 1 MiB, or a binary marker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContent' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateSessionFile
      tags: [files]
      description: Replaces the text of an existing file; content is its only mutable field (AIP-134).
      parameters:
        - $ref: '#/components/parameters/FilePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileInput' }
      responses:
        '200':
          description: The saved file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileContent' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/terminal:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: connectTerminal
      tags: [terminal]
      description: >-
        WebSocket to the session's interactive shell, started in the session folder on first
        connect and kept running between connections (a reconnect first receives recent output).
        Binary frames carry raw terminal bytes both ways; text frames carry JSON:
        TerminalControl from the client, TerminalEvent from the server.
      parameters:
        - { name: cols, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: rows, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '101':
          description: Switched to the WebSocket protocol.
        '404':
          description: No such session or its folder is missing.
        '503':
          description: Too many shells are open on the server.
  /sessions/{sessionId}/git:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getGitStatus
      tags: [git]
      description: >-
        Git state of the session folder, a singleton resource (AIP-156): branch, upstream,
        ahead/behind and changed files. A folder that is not the top of a repository returns
        `repository: false`; repositories above the folder are not looked up.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git/diff:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getGitDiff
      tags: [git]
      description: >-
        Unified diff of one path: the index against HEAD when `staged`, otherwise the
        worktree against the index; an untracked file is shown as all added. Cut at 512 KiB.
      parameters:
        - name: path
          in: query
          required: true
          description: Path relative to the repository root.
          schema: { type: string, minLength: 1 }
        - name: staged
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: The diff, empty when the path has no changes on that side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitDiff' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git/branches:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listGitBranches
      tags: [git]
      description: Local branches, most recently committed first, up to 500 (no pagination).
      responses:
        '200':
          description: The branches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListGitBranchesResponse' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git/commits:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listGitCommits
      tags: [git]
      description: >-
        History of HEAD, newest first (AIP-158 pagination). The page token pins the head the
        listing started from, so new commits do not shift later pages.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of commits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListGitCommitsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:init:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: initGitRepository
      tags: [git]
      description: Custom method (AIP-136) that runs `git init` in the session folder; a no-op in a repository.
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:stage:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: stageGitPaths
      tags: [git]
      description: Custom method (AIP-136) that stages the paths, every change when `paths` is empty.
      requestBody: { $ref: '#/components/requestBodies/GitPaths' }
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:unstage:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: unstageGitPaths
      tags: [git]
      description: Custom method (AIP-136) that unstages the paths, everything when `paths` is empty.
      requestBody: { $ref: '#/components/requestBodies/GitPaths' }
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:discard:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: discardGitChanges
      tags: [git]
      description: >-
        Custom method (AIP-136) that drops unstaged changes of the paths: tracked files are
        restored from the index, untracked files are deleted. `paths` must not be empty.
      requestBody: { $ref: '#/components/requestBodies/GitPaths' }
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:commit:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: commitGitChanges
      tags: [git]
      description: Custom method (AIP-136) that commits the staged changes; 409 with git's message when it fails.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitCommitRequest' }
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:checkout:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: checkoutGitBranch
      tags: [git]
      description: Custom method (AIP-136) that switches to a branch, or creates it from HEAD when `create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitCheckoutRequest' }
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:pull:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: pullGitBranch
      tags: [git]
      description: Custom method (AIP-136) that runs `git pull --ff-only`, up to 2 minutes.
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/git:push:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: pushGitBranch
      tags: [git]
      description: >-
        Custom method (AIP-136) that pushes the current branch, setting its upstream to
        origin when it has none, up to 2 minutes.
      responses:
        '200': { $ref: '#/components/responses/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: listMessages
      tags: [sessions]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of messages, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListMessagesResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createMessage
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageInput' }
      responses:
        '201':
          description: The stored user message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/messages/{messageId}:answer:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: answerQuestion
      description: >-
        Custom method (AIP-136) on a question card: stores the user's answers and sends them
        to the agent as the next prompt. Only a pending card takes answers.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerInput' }
      responses:
        '200':
          description: The answered question card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/messages/{messageId}:continue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: continueAfterLimit
      description: >-
        Custom method (AIP-136) on a limit card: asks the agent to continue right away,
        together with messages that waited for the limit.
      tags: [sessions]
      responses:
        '204': { description: The continuation is queued. }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/messages/{messageId}:scheduleContinue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: scheduleContinueAfterLimit
      description: >-
        Custom method (AIP-136) on a limit card: the agent continues on its own a minute after
        the limit resets. Messages sent meanwhile wait and reach it with the continuation.
      tags: [sessions]
      responses:
        '204': { description: The continuation is scheduled. }
        default: { $ref: '#/components/responses/Error' }
  /sessions/{sessionId}/messages/{messageId}:cancelContinue:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: cancelContinueAfterLimit
      description: >-
        Custom method (AIP-136) on a limit card: drops the scheduled continuation; messages
        that waited for it go to the agent now.
      tags: [sessions]
      responses:
        '204': { description: The continuation is cancelled. }
        default: { $ref: '#/components/responses/Error' }
  /attachments:
    post:
      operationId: uploadAttachment
      description: >-
        Uploads an image for a message that is about to be sent (AIP-133 create with a raw
        media body). PNG, JPEG, GIF or WebP up to 5 MB, detected from the bytes. The upload
        belongs to no message until `attachmentIds` of a new message or session claims it;
        unclaimed uploads are deleted after a day.
      tags: [attachments]
      parameters:
        - name: name
          in: query
          description: Original file name; only its base name is kept.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: The stored image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '413':
          description: The image is larger than 5 MB.
        '415':
          description: Not a PNG, JPEG, GIF or WebP image.
        default: { $ref: '#/components/responses/Error' }
  /attachments/{attachmentId}/content:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: getAttachmentContent
      description: The image bytes (media download), cacheable forever since attachments never change.
      tags: [attachments]
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /drafts:
    get:
      operationId: listDrafts
      tags: [drafts]
      responses:
        '200':
          description: Every draft of the signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListDraftsResponse' }
        default: { $ref: '#/components/responses/Error' }
  /drafts/{key}:
    parameters:
      - $ref: '#/components/parameters/DraftKey'
    put:
      operationId: updateDraft
      tags: [drafts]
      description: Creates or replaces the draft (AIP-134 with allow_missing). Empty text deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftInput' }
      responses:
        '200':
          description: The stored draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        '204': { description: 'Empty text: the draft was deleted.' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteDraft
      tags: [drafts]
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      responses:
        '200':
          description: All agent subscriptions of the user, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSubscriptionsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createSubscription
      tags: [subscriptions]
      description: >-
        Adds a subscription (AIP-133). Without a token it starts the agent CLI sign-in and
        returns the step to finish in the browser in `login`; with a `claude setup-token`
        token it is active at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201':
          description: The new subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      description: Signs out by removing the subscription and its stored credentials.
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}:activate:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: activateSubscription
      tags: [subscriptions]
      description: Makes the subscription the current one of its agent (AIP-136 custom method).
      responses:
        '200':
          description: The current subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}:startLogin:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: startSubscriptionLogin
      tags: [subscriptions]
      description: Starts the CLI sign-in again, e.g. after a failed or expired one (AIP-136).
      responses:
        '200':
          description: The subscription with a new `login` step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}:completeLogin:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      operationId: completeSubscriptionLogin
      tags: [subscriptions]
      description: Passes the code shown by the browser to the CLI and waits for its answer (AIP-136).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCodeInput' }
      responses:
        '200':
          description: The subscription, active or failed with `error`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        default: { $ref: '#/components/responses/Error' }
  /subscriptions/{subscriptionId}/usage:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      operationId: getSubscriptionUsage
      tags: [subscriptions]
      description: Usage limits as the agent reports them, cached for a minute (AIP-156 singleton).
      responses:
        '200':
          description: Limit windows, or the reason they are unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionUsage' }
        default: { $ref: '#/components/responses/Error' }
  /delivery:
    get:
      operationId: getDelivery
      tags: [delivery]
      description: >-
        Running version, the latest GitHub release and the update in progress (AIP-156 singleton).
        Releases are checked hourly; changes arrive as the `delivery.updated` event.
      responses:
        '200':
          description: Update state of this Drift instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        default: { $ref: '#/components/responses/Error' }
  /delivery/releases:
    get:
      operationId: listReleases
      tags: [delivery]
      description: Recent GitHub releases, newest first (AIP-132 without paging, at most 30).
      responses:
        '200':
          description: Releases that can be picked as a custom version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListReleasesResponse' }
        default: { $ref: '#/components/responses/Error' }
  /delivery:check:
    post:
      operationId: checkDelivery
      tags: [delivery]
      description: Checks GitHub for releases now, at most once a minute (AIP-136 custom method).
      responses:
        '200':
          description: Fresh update state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        default: { $ref: '#/components/responses/Error' }
  /delivery:install:
    post:
      operationId: installRelease
      tags: [delivery]
      description: >-
        Downloads the release binary, verifies it against checksums.txt, swaps it in and relaunches
        the process (AIP-136 custom method). Progress arrives as `delivery.updated` events.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallReleaseRequest' }
      responses:
        '202':
          description: The update has started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        default: { $ref: '#/components/responses/Error' }
  /events:
    get:
      operationId: streamEvents
      tags: [events]
      description: >-
        Server-Sent Events for the signed-in user. Each data line is a WireEvent.
        Reconnect with Last-Event-ID to replay missed events; a "resync" event means refetch.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/WireEvent' }
components:
  securitySchemes:
    kratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
  parameters:
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DraftKey:
      name: key
      in: path
      required: true
      description: '"session:<session id>" or "new:<project id>".'
      schema: { type: string }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FilePath:
      name: path
      in: query
      schema: { type: string }
  requestBodies:
    GitPaths:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GitPathsRequest' }
  responses:
    Error:
      description: Error with a human-readable message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GitStatus:
      description: >-
        The status after the change. Failures of the command return 409 with its own message,
        invalid paths or names 400, a session of somebody else 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GitStatus' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Project:
      type: object
      required: [id, name, path, sessionCount, createTime, updateTime]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        path: { type: string }
        sessionCount: { type: integer }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name, path]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        path:
          type: string
          description: Folder relative to the workspace root. A missing folder is created.
    ProjectRename:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    ListProjectsResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextPageToken: { type: string }
    AgentId:
      type: string
      enum: [claude, codex, antigravity, kimi, mimo]
    Session:
      type: object
      required: [id, title, agent, status, createTime, updateTime]
      properties:
        id: { type: string, format: uuid }
        projectId:
          description: Absent for a standalone session.
          type: string
          format: uuid
        title: { type: string }
        agent: { $ref: '#/components/schemas/AgentId' }
        status:
          type: string
          enum: [idle, running]
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
    PermissionMode:
      description: Permission mode the agent runs with, named as in Claude Code.
      type: string
      enum: [default, acceptEdits, auto, plan, bypassPermissions]
    SessionInput:
      description: Creating a session with text also starts its agent.
      type: object
      required: [agent]
      properties:
        agent: { $ref: '#/components/schemas/AgentId' }
        title: { type: string, maxLength: 200 }
        text: { type: string }
        attachmentIds: { $ref: '#/components/schemas/AttachmentIds' }
        model: { type: string, maxLength: 100 }
        mode: { $ref: '#/components/schemas/PermissionMode' }
    AttachmentIds:
      description: Uploaded images (see uploadAttachment) that go with the message, in order.
      type: array
      maxItems: 10
      items: { type: string, format: uuid }
    SessionUpdate:
      description: >-
        Partial update (AIP-134): only the fields present are changed. Changing `agent`
        hands the conversation to another model family, which starts without the
        previous agent's context.
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        agent: { $ref: '#/components/schemas/AgentId' }
    ListSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/Session' }
        nextPageToken: { type: string }
    CreateSessionResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        message: { $ref: '#/components/schemas/Message' }
    Attachment:
      description: An image attached to a user message; its bytes are at `/attachments/{id}/content`.
      type: object
      required: [id, name, size, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        type: { type: string }
    MessageBody:
      type: object
      properties:
        text: { type: string }
        name: { type: string }
        input: { type: string }
        output:
          type: array
          items: { type: string }
        status:
          description: >-
            Tool call: running, done, stopped, error. Question card: pending, answered,
            dismissed. Limit card: reached, scheduled, continued, superseded.
          type: string
          enum:
            - running
            - done
            - stopped
            - error
            - pending
            - answered
            - dismissed
            - reached
            - scheduled
            - continued
            - superseded
        meta: { type: string }
        code:
          description: Why a system note was written; the client words it.
          type: string
          enum: [stopped, failed, noSubscription, unsupportedAgent, usageWarning]
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        window:
          description: Usage limit window of a usageWarning note or a limit card, e.g. five_hour.
          type: string
        windowMinutes: { type: integer }
        percentLeft:
          description: Share of the window still unused, 0 to 100.
          type: integer
        resetTime: { type: string, format: date-time }
    Question:
      type: object
      required: [question]
      properties:
        question: { type: string }
        header: { type: string }
        multiSelect: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuestionOption' }
    QuestionOption:
      type: object
      required: [label]
      properties:
        label: { type: string }
        description: { type: string }
    Answer:
      description: The answer to the question with the same index; options, own text or both.
      type: object
      properties:
        selected:
          type: array
          items: { type: string }
        custom: { type: string, maxLength: 2000 }
    AnswerInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        model: { type: string, maxLength: 100 }
        mode: { $ref: '#/components/schemas/PermissionMode' }
    Message:
      type: object
      required: [id, sessionId, role, kind, body, createTime]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant, system]
        kind:
          type: string
          enum: [text, thinking, tool, note, question, limit]
        body: { $ref: '#/components/schemas/MessageBody' }
        createTime: { type: string, format: date-time }
    MessageInput:
      description: >-
        A user message starts the session's agent; while it runs, messages queue and
        reach it together as the next prompt. Needs text, attachments or both.
      type: object
      properties:
        text: { type: string }
        attachmentIds: { $ref: '#/components/schemas/AttachmentIds' }
        model: { type: string, maxLength: 100 }
        mode: { $ref: '#/components/schemas/PermissionMode' }
    ListMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        nextPageToken: { type: string }
    Draft:
      type: object
      required: [key, text, deviceId, updateTime]
      properties:
        key: { type: string }
        text: { type: string }
        deviceId: { type: string }
        updateTime: { type: string, format: date-time }
    DraftInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 65536 }
    ListDraftsResponse:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items: { $ref: '#/components/schemas/Draft' }
    TreeEntry:
      type: object
      required: [name, path, dir]
      properties:
        name: { type: string }
        path: { type: string }
        dir: { type: boolean }
        size: { type: integer }
    TreeEntryInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: Path relative to the project folder. }
        dir: { type: boolean }
    TreeResponse:
      type: object
      required: [path, entries]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
        truncated: { type: boolean }
    FileContent:
      type: object
      required: [path, size, content]
      properties:
        path: { type: string }
        size: { type: integer }
        content: { type: string }
        binary: { type: boolean }
        truncated: { type: boolean }
    FileInput:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 1048576 }
    SubscriptionInput:
      type: object
      required: [agent]
      properties:
        agent: { $ref: '#/components/schemas/AgentId' }
        token: { type: string, description: Long-lived token from `claude setup-token`. }
    LoginCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 1 }
    SubscriptionLogin:
      type: object
      required: [url, needsCode]
      properties:
        url: { type: string, format: uri }
        userCode: { type: string, description: Code to enter on the page (device flow). }
        needsCode: { type: boolean, description: The page shows a code to paste back into Drift. }
    Subscription:
      type: object
      description: An agent account Drift is signed in to through the agent CLI (AIP-121 resource).
      required: [id, agent, method, state, account, plan, current, createTime, updateTime]
      properties:
        id: { type: string, format: uuid }
        agent: { $ref: '#/components/schemas/AgentId' }
        method:
          type: string
          enum: [login, token]
        state:
          type: string
          enum: [pending, active, failed]
        account: { type: string }
        plan: { type: string }
        error: { type: string }
        current: { type: boolean }
        login: { $ref: '#/components/schemas/SubscriptionLogin' }
        createTime: { type: string, format: date-time }
        updateTime: { type: string, format: date-time }
    ListSubscriptionsResponse:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
    UsageWindow:
      type: object
      required: [id, usedPercent]
      properties:
        id: { type: string, description: 'five_hour, seven_day, seven_day_opus… (Claude); primary, secondary (Codex); a model slug such as gemini_4_argon (Antigravity); a limit_5h, limit_7d, limit_month_total, limit_month_code (Kimi).' }
        label: { type: string, description: 'The agent''s own name for the window, e.g. the model of an Antigravity quota.' }
        usedPercent: { type: number }
        windowMinutes: { type: integer }
        resetTime: { type: string, format: date-time }
    SubscriptionUsage:
      type: object
      required: [windows, readTime]
      properties:
        windows:
          type: array
          items: { $ref: '#/components/schemas/UsageWindow' }
        unavailable:
          type: string
          enum: [signed_out, expired, token_login, unsupported, error]
        readTime: { type: string, format: date-time }
    SessionActivity:
      description: >-
        What a running agent is doing right now, sent as the `session.activity` event and
        never stored: thinking (with estimated tokens), writing (the reply so far) or
        preparing a tool call.
      type: object
      required: [sessionId, phase]
      properties:
        sessionId: { type: string, format: uuid }
        phase:
          type: string
          enum: [thinking, writing, tool]
        tool: { type: string }
        text: { type: string }
        tokens: { type: integer }
    GitStatus:
      description: >-
        Git state of a session folder, a singleton resource (AIP-156). `staged` compares the
        index with HEAD, `unstaged` the worktree with the index plus untracked files.
      type: object
      required: [repository, detached, ahead, behind, staged, unstaged]
      properties:
        repository: { type: boolean }
        branch: { type: string, description: Absent when HEAD is detached. }
        detached: { type: boolean }
        head: { type: string, description: 'Abbreviated commit of HEAD; absent before the first commit.' }
        upstream: { type: string }
        ahead: { type: integer }
        behind: { type: integer }
        staged:
          type: array
          items: { $ref: '#/components/schemas/GitFileChange' }
        unstaged:
          type: array
          items: { $ref: '#/components/schemas/GitFileChange' }
        truncated: { type: boolean, description: More than 2000 changes on one side. }
    GitFileChange:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        origPath: { type: string, description: Previous path of a staged rename or copy. }
        status: { $ref: '#/components/schemas/GitChangeStatus' }
    GitChangeStatus:
      type: string
      enum: [modified, added, deleted, renamed, copied, typeChanged, conflicted, untracked]
    GitDiff:
      type: object
      required: [path, staged, diff]
      properties:
        path: { type: string }
        staged: { type: boolean }
        diff: { type: string, description: Unified diff as git prints it. }
        truncated: { type: boolean }
    GitBranch:
      type: object
      required: [name, current]
      properties:
        name: { type: string }
        current: { type: boolean }
        upstream: { type: string }
    ListGitBranchesResponse:
      type: object
      required: [branches]
      properties:
        branches:
          type: array
          items: { $ref: '#/components/schemas/GitBranch' }
    GitCommit:
      description: One commit of the history; `authorTime` is named after AIP-142.
      type: object
      required: [hash, shortHash, subject, authorName, authorEmail, authorTime]
      properties:
        hash: { type: string }
        shortHash: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        authorTime: { type: string, format: date-time }
    ListGitCommitsResponse:
      type: object
      required: [commits]
      properties:
        commits:
          type: array
          items: { $ref: '#/components/schemas/GitCommit' }
        nextPageToken: { type: string }
    GitPathsRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          maxItems: 1000
          description: Paths relative to the repository root; `..` and absolute paths are rejected.
          items: { type: string }
    GitCommitRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    GitCheckoutRequest:
      type: object
      required: [branch]
      properties:
        branch: { type: string, minLength: 1, maxLength: 250 }
        create: { type: boolean, description: Create the branch from HEAD before switching. }
    TerminalControl:
      description: Text frame from the client to the terminal WebSocket.
      type: object
      required: [type, cols, rows]
      properties:
        type: { type: string, enum: [resize] }
        cols: { type: integer, minimum: 1, maximum: 1000 }
        rows: { type: integer, minimum: 1, maximum: 1000 }
    TerminalEvent:
      description: Text frame from the terminal WebSocket; `exit` arrives once the shell has ended.
      type: object
      required: [type, exitCode]
      properties:
        type: { type: string, enum: [exit] }
        exitCode: { type: integer }
    Release:
      type: object
      description: One GitHub release of Drift (AIP-121 resource).
      required: [version, name, notes, url, publishTime, prerelease, installable]
      properties:
        version: { type: string, description: Release tag, e.g. v1.2.0. }
        name: { type: string }
        notes: { type: string, description: Release notes in Markdown. }
        url: { type: string, format: uri }
        publishTime: { type: string, format: date-time }
        prerelease: { type: boolean }
        installable: { type: boolean, description: The release has a binary for this platform and checksums. }
    ListReleasesResponse:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: '#/components/schemas/Release' }
    DeliveryRepository:
      type: object
      required: [url, stars]
      properties:
        url: { type: string, format: uri }
        stars: { type: integer }
    DeliveryInstallation:
      type: object
      required: [state, downloadedBytes, totalBytes]
      properties:
        state:
          type: string
          enum: [idle, downloading, restarting, failed]
        targetVersion: { type: string }
        downloadedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        error: { type: string }
    Delivery:
      type: object
      description: Update state of the instance (AIP-156 singleton).
      required: [currentVersion, releaseBuild, updateAvailable, repository, installation]
      properties:
        currentVersion: { type: string, description: 'Release tag, `git describe` output of a local build, or "dev".' }
        releaseBuild: { type: boolean }
        latestRelease: { $ref: '#/components/schemas/Release' }
        updateAvailable: { type: boolean }
        repository: { $ref: '#/components/schemas/DeliveryRepository' }
        installBlocker:
          type: string
          enum: [development_build, read_only]
          description: Why this instance cannot install releases itself.
        installation: { $ref: '#/components/schemas/DeliveryInstallation' }
        checkTime: { type: string, format: date-time }
    InstallReleaseRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, minLength: 1 }
    WireEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - resync
            - project.created
            - project.updated
            - project.deleted
            - session.created
            - session.updated
            - session.deleted
            - session.activity
            - message.created
            - message.updated
            - draft.updated
            - draft.deleted
            - subscription.created
            - subscription.updated
            - subscription.deleted
            - delivery.updated
        data: {}
        origin: { type: string }
